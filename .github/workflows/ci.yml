name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests --select E9,F63,F7,F82  # syntax errors / undefined names
      - run: pytest -q tests

  backend-weekdays:
    # Plans are anchored on date.today(); run the suite frozen to every weekday so a
    # test that only passes on some days fails here instead of on a Wednesday.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          for day in mon tue wed thu fri sat sun; do
            echo "::group::$day"
            STRIDE_TEST_DATE=$day pytest -q -p no:cacheprovider tests || failed="$failed $day"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::suite failed on:$failed"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run lint
      - run: npm run build
