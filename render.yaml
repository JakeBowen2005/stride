# Render Blueprint: New → Blueprint in the dashboard, pick this repo. See README "Deploying to Render".
services:
  - type: web
    name: stride
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: stride-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/stride.db
      - key: GARMIN_TOKENSTORE
        value: /var/data/.garmin
      # Critical: plan logic uses date.today(), so the container must be on Jake's clock.
      - key: TZ
        value: America/Los_Angeles
      - key: NODE_OPTIONS
        value: --max-old-space-size=192
      - key: STRIDE_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GARMIN_TOKENS_JSON
        sync: false
